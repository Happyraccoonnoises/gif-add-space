<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GIF Display</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #000;
      color: #fff;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .screen {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: #000;
    }

    #gifImage {
      max-width: 100vw;
      max-height: 100vh;
      width: auto;
      height: auto;
      object-fit: contain;
      display: none;
    }

    .status {
      position: absolute;
      bottom: 16px;
      left: 16px;
      padding: 8px 12px;
      background: rgba(0, 0, 0, 0.6);
      border-radius: 8px;
      font-size: 14px;
      color: #ddd;
    }

    .placeholder {
      font-size: 24px;
      color: #888;
      text-align: center;
      padding: 24px;
    }
  </style>
</head>
<body>
<div class="screen">
  <img id="gifImage" src="" alt="Aktuelles GIF" />
  <div id="placeholder" class="placeholder">Warte auf das nächste GIF ...</div>
  <div id="status" class="status">Verbinde...</div>
</div>

<script>
  const API_BASE_URL = "https://gif-space-backend.onrender.com";
  const gifImage = document.getElementById("gifImage");
  const placeholder = document.getElementById("placeholder");
  const status = document.getElementById("status");

  let currentGifPath = null;

  async function loadLatestGif() {
    try {
      const response = await fetch(`${API_BASE_URL}/uploads/latest`, {
        cache: "no-store"
      });

      if (!response.ok) {
        if (response.status === 404) {
          status.textContent = "Noch kein GIF vorhanden";
          gifImage.style.display = "none";
          placeholder.style.display = "block";
          return;
        }

        throw new Error("Fehler beim Laden von /uploads/latest");
      }

      const data = await response.json();

      if (!data.success || !data.latestGif) {
        throw new Error("Ungültige Antwort vom Server");
      }

      const newGifPath = data.latestGif.path;

      if (newGifPath !== currentGifPath) {
        currentGifPath = newGifPath;
        gifImage.src = `${API_BASE_URL}${newGifPath}?t=${Date.now()}`;
        gifImage.style.display = "block";
        placeholder.style.display = "none";
        status.textContent = "Neues GIF geladen";
      } else {
        status.textContent = "Warte auf neues GIF";
      }
    } catch (error) {
      console.error(error);
      status.textContent = "Verbindung unterbrochen - neuer Versuch läuft";
    }
  }

  async function keepAlivePing() {
    try {
      await fetch(`${API_BASE_URL}/uploads/latest`, {
        cache: "no-store"
      });
    } catch (error) {
      console.error("Ping fehlgeschlagen:", error);
    }
  }

  loadLatestGif();
  setInterval(loadLatestGif, 5000);
  setInterval(keepAlivePing, 14 * 60 * 1000);
</script>
</body>
</html>
