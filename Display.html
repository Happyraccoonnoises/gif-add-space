<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GIF Display</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Allerta+Stencil&display=swap');

    :root {
      --color-black: #000000;
      --color-light: #E3F1E6;
      --color-dark-green: #172524;
      --color-pink: #f3E2DE;
      --color-white: #FFFFFF;
      --radius-xl: 28px;
      --radius-lg: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family: Arial, sans-serif;
      color: var(--color-light);
      background:
        radial-gradient(circle at top left, rgba(243, 226, 222, 0.08), transparent 30%),
        radial-gradient(circle at bottom right, rgba(227, 241, 230, 0.06), transparent 28%),
        var(--color-black);
      overflow: hidden;
    }

    .display-layout {
      width: 100vw;
      height: 100vh;
      display: grid;
      grid-template-columns: 1.6fr 0.7fr;
      gap: 24px;
      padding: 24px;
    }

    .display-panel,
    .qr-panel {
      background: rgba(23, 37, 36, 0.88);
      border: 1px solid rgba(227, 241, 230, 0.14);
      border-radius: var(--radius-xl);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.3);
    }

    .display-panel {
      padding: 24px;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .display-header {
      margin-bottom: 18px;
    }

    .eyebrow {
      font-family: 'Allerta Stencil', sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--color-pink);
      margin-bottom: 0.75rem;
    }

    .display-title {
      font-family: 'Allerta Stencil', sans-serif;
      font-size: clamp(2rem, 3vw, 3.5rem);
      line-height: 1;
      color: var(--color-white);
      margin-bottom: 0.75rem;
    }

    .display-subtitle {
      font-size: 1rem;
      color: rgba(227, 241, 230, 0.82);
      max-width: 60ch;
    }

    .gif-stage {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-lg);
      background: rgba(0, 0, 0, 0.28);
      border: 1px solid rgba(227, 241, 230, 0.1);
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    #gifImage {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      display: none;
      border-radius: 18px;
    }

    .placeholder {
      text-align: center;
      color: rgba(227, 241, 230, 0.65);
      font-size: 1.2rem;
      max-width: 20ch;
    }

    .status {
      margin-top: 14px;
      font-size: 0.9rem;
      color: rgba(227, 241, 230, 0.65);
    }

    .qr-panel {
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 20px;
    }

    .qr-top h2 {
      font-family: 'Allerta Stencil', sans-serif;
      font-size: 1.7rem;
      color: var(--color-white);
      margin-bottom: 0.8rem;
      line-height: 1.1;
    }

    .qr-top p {
      color: rgba(227, 241, 230, 0.82);
      font-size: 1rem;
      line-height: 1.5;
    }

    .qr-box {
      background: var(--color-pink);
      border-radius: 24px;
      padding: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qr-box img {
      width: 100%;
      max-width: 260px;
      aspect-ratio: 1 / 1;
      background: white;
      border-radius: 16px;
      padding: 12px;
    }

    .upload-url {
      display: inline-block;
      padding: 0.8rem 1rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--color-light);
      font-size: 0.92rem;
      word-break: break-word;
    }

    @media (max-width: 1100px) {
      .display-layout {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr auto;
      }

      .qr-panel {
        flex-direction: row;
        align-items: center;
      }

      .qr-top {
        flex: 1;
      }

      .qr-box img {
        max-width: 180px;
      }
    }
  </style>
</head>
<body>
<div class="display-layout">
  <section class="display-panel">
    <div class="display-header">
      <p class="eyebrow">Frequenz Kollektiv presents</p>
      <h1 class="display-title">GIF Add Space</h1>
      <p class="display-subtitle">
        Lade ein GIF hoch und sieh zu, wie es direkt auf dem Screen erscheint.
      </p>
    </div>

    <div class="gif-stage">
      <img id="gifImage" src="" alt="Aktuelles GIF" />
      <div id="placeholder" class="placeholder">Warte auf das nächste GIF ...</div>
    </div>

    <div id="status" class="status">Verbinde...</div>
  </section>

  <aside class="qr-panel">
    <div class="qr-top">
      <h2>Upload dein GIF</h2>
      <p>
        Scanne den QR-Code und lade dein GIF direkt vom Handy hoch.
      </p>
    </div>

    <div class="qr-box">
      <img
        src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=https://happyraccoonnoises.github.io/gif-add-space/"
        alt="QR-Code zur Upload-Seite"
      />
    </div>

    <div class="upload-url">
      happyraccoonnoises.github.io/gif-add-space/
    </div>
  </aside>
</div>

<script>
  const API_BASE_URL = "https://gif-space-backend.onrender.com";
  const gifImage = document.getElementById("gifImage");
  const placeholder = document.getElementById("placeholder");
  const status = document.getElementById("status");

  let currentGifPath = null;

  async function loadLatestGif() {
    try {
      const response = await fetch(`${API_BASE_URL}/uploads/latest`, {
        cache: "no-store"
      });

      if (!response.ok) {
        if (response.status === 404) {
          status.textContent = "Noch kein GIF vorhanden";
          gifImage.style.display = "none";
          placeholder.style.display = "block";
          return;
        }

        throw new Error("Fehler beim Laden von /uploads/latest");
      }

      const data = await response.json();

      if (!data.success || !data.latestGif) {
        throw new Error("Ungültige Antwort vom Server");
      }

      const newGifPath = data.latestGif.path;

      if (newGifPath !== currentGifPath) {
        currentGifPath = newGifPath;
        gifImage.src = `${API_BASE_URL}${newGifPath}?t=${Date.now()}`;
        gifImage.style.display = "block";
        placeholder.style.display = "none";
        status.textContent = "Neues GIF geladen";
      } else {
        status.textContent = "Warte auf neues GIF";
      }
    } catch (error) {
      console.error(error);
      status.textContent = "Verbindung unterbrochen - neuer Versuch läuft";
    }
  }

  async function keepAlivePing() {
    try {
      await fetch(`${API_BASE_URL}/uploads/latest`, {
        cache: "no-store"
      });
    } catch (error) {
      console.error("Ping fehlgeschlagen:", error);
    }
  }

  loadLatestGif();
  setInterval(loadLatestGif, 5000);
  setInterval(keepAlivePing, 14 * 60 * 1000);
</script>
</body>
</html>
