<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GIF Display</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Allerta+Stencil&display=swap');

    :root {
      --color-black: #000000;
      --color-light: #E3F1E6;
      --color-dark-green: #172524;
      --color-pink: #f3E2DE;
      --color-white: #FFFFFF;
      --radius-xl: 28px;
      --radius-lg: 20px;
      --transition: 180ms ease;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family: Arial, sans-serif;
      color: var(--color-light);
      background:
        radial-gradient(circle at top left, rgba(243, 226, 222, 0.08), transparent 30%),
        radial-gradient(circle at bottom right, rgba(227, 241, 230, 0.06), transparent 28%),
        var(--color-black);
      overflow: hidden;
    }

    .display-shell {
      width: 100vw;
      height: 100vh;
      padding: 24px;
      display: flex;
    }

    .display-panel {
      width: 100%;
      background: rgba(23, 37, 36, 0.88);
      border: 1px solid rgba(227, 241, 230, 0.14);
      border-radius: var(--radius-xl);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.3);
      padding: 24px;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }

    .display-topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 20px;
    }

    .display-header {
      max-width: 70ch;
    }

    .eyebrow {
      font-family: 'Allerta Stencil', sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--color-pink);
      margin-bottom: 0.75rem;
    }

    .display-title {
      font-family: 'Allerta Stencil', sans-serif;
      font-size: clamp(2rem, 3vw, 3.5rem);
      line-height: 1;
      color: var(--color-white);
      margin-bottom: 0.75rem;
    }

    .display-subtitle {
      font-size: 1rem;
      color: rgba(227, 241, 230, 0.82);
      max-width: 58ch;
    }

    .mode-button {
      border: none;
      border-radius: 999px;
      padding: 0.95rem 1.2rem;
      background: var(--color-pink);
      color: #172524;
      font-family: 'Allerta Stencil', sans-serif;
      font-size: 0.95rem;
      cursor: pointer;
      transition: transform var(--transition), opacity var(--transition), box-shadow var(--transition);
      box-shadow: 0 10px 24px rgba(243, 226, 222, 0.16);
      white-space: nowrap;
    }

    .mode-button:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    .gif-stage {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-lg);
      background: rgba(0, 0, 0, 0.28);
      border: 1px solid rgba(227, 241, 230, 0.1);
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    .gif-image {
      position: absolute;
      inset: 24px;
      width: calc(100% - 48px);
      height: calc(100% - 48px);
      object-fit: contain;
      border-radius: 18px;
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.28);
      opacity: 0;
      transition: opacity 420ms ease;
      pointer-events: none;
    }

    .gif-image.is-visible {
      opacity: 1;
    }

    .placeholder {
      text-align: center;
      color: rgba(227, 241, 230, 0.65);
      font-size: 1.2rem;
      max-width: 20ch;
    }

    .status {
      margin-top: 14px;
      font-size: 0.9rem;
      color: rgba(227, 241, 230, 0.6);
    }

    .gif-stage:fullscreen {
      width: 100vw;
      height: 100vh;
      padding: 0;
      border: none;
      border-radius: 0;
      background: #000000;
    }

    .gif-stage:fullscreen .gif-image {
      inset: 0;
      width: 100%;
      height: 100%;
      border-radius: 0;
      box-shadow: none;
    }

    .gif-stage:fullscreen .placeholder {
      font-size: 2rem;
    }

    @media (max-width: 900px) {
      .display-topbar {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
<div class="display-shell">
  <section class="display-panel">
    <div class="display-topbar">
      <div class="display-header">
        <p class="eyebrow">Frequenz Kollektiv presents</p>
        <h1 class="display-title">GIF Add Space</h1>
        <p class="display-subtitle">
          Live-Ansicht der zuletzt hochgeladenen GIFs.
        </p>
      </div>

      <button id="fullscreen-toggle" class="mode-button" type="button">
        Vollbildmodus
      </button>
    </div>

    <div id="gif-stage" class="gif-stage">
      <img id="gifImageA" class="gif-image is-visible" src="" alt="Aktuelles GIF" />
      <img id="gifImageB" class="gif-image" src="" alt="Aktuelles GIF" />
      <div id="placeholder" class="placeholder">Warte auf das nächste GIF ...</div>
    </div>

    <div id="status" class="status">Verbinde...</div>
  </section>
</div>

<script>
  const API_BASE_URL = "https://gif-space-backend.onrender.com";
  const gifImageA = document.getElementById("gifImageA");
  const gifImageB = document.getElementById("gifImageB");
  const placeholder = document.getElementById("placeholder");
  const status = document.getElementById("status");
  const gifStage = document.getElementById("gif-stage");
  const fullscreenToggle = document.getElementById("fullscreen-toggle");

  let activeImage = gifImageA;
  let inactiveImage = gifImageB;
  let currentGifPath = null;
  let isLoading = false;

  async function loadLatestGif(forceRefresh = false) {
    if (isLoading) return;
    isLoading = true;

    try {
      const response = await fetch(`${API_BASE_URL}/uploads/latest`, {
        cache: "no-store"
      });

      if (!response.ok) {
        if (response.status === 404) {
          status.textContent = "Noch kein GIF vorhanden";
          gifImageA.classList.remove("is-visible");
          gifImageB.classList.remove("is-visible");
          placeholder.style.display = "block";
          return;
        }

        throw new Error("Fehler beim Laden von /uploads/latest");
      }

      const data = await response.json();

      if (!data.success || !data.latestGif) {
        throw new Error("Ungültige Antwort vom Server");
      }

      const newGifPath = data.latestGif.path;
      const hasNewGif = newGifPath !== currentGifPath;

      if (hasNewGif || forceRefresh) {
        currentGifPath = newGifPath;

        const nextUrl = `${API_BASE_URL}${newGifPath}?t=${Date.now()}`;

        inactiveImage.onload = () => {
          inactiveImage.classList.add("is-visible");
          activeImage.classList.remove("is-visible");
          placeholder.style.display = "none";
          status.textContent = "GIF aktuell geladen";

          const previousActive = activeImage;
          activeImage = inactiveImage;
          inactiveImage = previousActive;
          inactiveImage.onload = null;
        };

        inactiveImage.src = nextUrl;
      } else {
        status.textContent = "Warte auf neues GIF";
      }
    } catch (error) {
      console.error(error);
      status.textContent = "Verbindung unterbrochen - neuer Versuch läuft";
    } finally {
      isLoading = false;
    }
  }

  async function toggleFullscreen() {
    try {
      if (!document.fullscreenElement) {
        await gifStage.requestFullscreen();
      } else {
        await document.exitFullscreen();
      }
    } catch (error) {
      console.error("Fullscreen-Fehler:", error);
    }
  }

  fullscreenToggle.addEventListener("click", toggleFullscreen);

  document.addEventListener("fullscreenchange", () => {
    fullscreenToggle.textContent = document.fullscreenElement
      ? "Vollbild verlassen"
      : "Vollbildmodus";
  });

  document.addEventListener("visibilitychange", async () => {
    if (!document.hidden) {
      await loadLatestGif(true);
    }
  });

  window.addEventListener("focus", async () => {
    await loadLatestGif(true);
  });

  loadLatestGif(true);
  setInterval(() => loadLatestGif(), 5000);
</script>
</body>
</html>
